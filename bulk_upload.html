const HOWTO_DEFAULT = "https://youtu.be/sWjPWRbE6lI?si=BP1VtKHb3k28I9N4";

const log = document.getElementById('log');
const doneEl = document.getElementById('doneCount');
const skipEl = document.getElementById('skipCount');
const failEl = document.getElementById('failCount');
const progBar = document.getElementById('progBar');
const startBtn = document.getElementById('startBtn');

function addLog(msg, cls){
  const line = document.createElement('div');
  line.className = cls || 'info';
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function toEmbed(url){
  // Normalize youtube shorts URL for consistency (matches admin.html logic if any)
  return url;
}

window.startUpload = async function(){
  startBtn.disabled = true;
  startBtn.textContent = '⏳ Uploading...';
  let done = 0, skip = 0, fail = 0;

  // Get existing templates to check duplicates by num
  addLog('Checking existing templates...', 'info');
  const existingSnap = await get(ref(db, 'templates'));
  const existing = existingSnap.val() || {};
  const existingNums = new Set(Object.values(existing).map(t => t.num));

  addLog(`Found ${existingNums.size} existing templates in database.`, 'info');
  addLog('Starting upload...', 'info');

  for(let i=0; i<templates.length; i++){
    const t = templates[i];
    if(existingNums.has(t.num)){
      addLog(`⏭ Skipped #${t.num} (already exists)`, 'err');
      skip++;
    } else {
      try {
        await push(ref(db, 'templates'), {
          num: t.num,
          video: t.video,
          capcut: t.capcut,
          howto: HOWTO_DEFAULT,
          cat: 'trending',
          createdAt: Date.now()
        });
        addLog(`✅ Added #${t.num}`, 'ok');
        done++;
      } catch(e){
        addLog(`❌ Failed #${t.num}: ${e.message}`, 'err');
        fail++;
      }
    }
    doneEl.textContent = done;
    skipEl.textContent = skip;
    failEl.textContent = fail;
    progBar.style.width = (((i+1)/templates.length)*100) + '%';
    await new Promise(r => setTimeout(r, 150)); // small delay to avoid rate limits
  }

  addLog('', 'info');
  addLog(`🎉 DONE! ${done} added, ${skip} skipped, ${fail} failed.`, 'ok');
  startBtn.textContent = '✅ Upload Complete';
};
